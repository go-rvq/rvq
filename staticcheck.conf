# The default checks (inherit), but the style the repository keeps on purpose:
#
#   ST1001  dot imports: the HTML/Vuetify DSL (htmlgo, vuetify, vuetifyx) is
#           written as `. "…/vuetify"`, the way the builders read;
#   ST1019  the same package imported twice: the DSL's dot import next to a
#           named one (`v`), for the names the dot import would shadow;
#   ST1012  error variables named ErrFoo: perm.PermissionDenied and
#           l10n.IncorrectLocaleErr are public API the sites use.
checks = ["inherit", "-ST1001", "-ST1019", "-ST1012"]
