# The pictures of the documentation of the editor of the files of the site
# (hermon-cms tools/userdocs-shots): its page needs a site whose public/ is a
# git repository (-site).
- file: pages/site-files/images/page.png
  url: /admin/site/site-files
  # the tab Your draft: its actions, the changes and the history
  wait: .v-tabs
  expect: "!!document.querySelector('.v-window-item--active .v-card-text')"
  width: 1440
  height: 900
- file: pages/site-files/images/files.png
  url: /admin/site/site-files
  wait: .v-tabs
  # the tab Files: the IDE in the frame, its tree of the files
  expect: "(() => { const t = [...document.querySelectorAll('.v-tab')][1]; if (t && !window.zzOpen) { window.zzOpen = 1; t.click() } const d = document.querySelector('.v-window-item--active .gadide-host'); return !!d && d.innerText.includes('templates') })()"
  width: 1440
  height: 900
- file: guides/site-files/01-edit/images/changes.png
  url: /admin/site/site-files
  wait: .v-tabs
  # a file of the draft changed by the IDE, once; the page again, its diff open
  before: "fetch(location.pathname + '/ide/api/ide/file?path=templates/main.gad').then(r => r.json()).then(f => f.content.includes('by the editor') ? false : fetch(location.pathname + '/ide/api/ide/file', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: 'templates/main.gad', content: f.content + '\\n// the footer, by the editor\\n'})}).then(() => true)).then(changed => { if (changed) location.reload() })"
  expect: "(() => { const t = document.querySelector('.v-expansion-panel-title'); if (t && !window.zzOpen) { window.zzOpen = 1; t.click() } return !!document.querySelector('.v-expansion-panel-text pre') })()"
  width: 1440
  height: 900
- file: guides/site-files/03-commit/images/commit.png
  url: /admin/site/site-files
  wait: .v-tabs
  # the dialog of the commit: its message
  expect: "(() => { const b = [...document.querySelectorAll('.v-btn')].find(b => /commit/i.test(b.innerText)); if (b && !window.zzOpen) { window.zzOpen = 1; b.click() } return !!document.querySelector('.v-overlay--active input, .v-overlay--active textarea') })()"
  width: 1440
  height: 900
- file: guides/site-files/02-preview/images/preview.png
  url: /admin/site-preview/en-us
  # the page of the site, by the templates of the draft
  wait: p
  width: 1280
  height: 800
# the guide's step "Options of the layouts": the post type choosing the layout
# of its posts, and a post of it with that layout's options (a select of the
# `options`, open)
- file: guides/site-files/07-layout-options/images/post-type.png
  url: /admin/site/post-types/{post_type:books}
  # its form: the layout of its posts chosen
  expect: "(() => { const w = window; if (!w.zzEdit) { const b = document.querySelector('.mdi-pencil'); if (b) { w.zzEdit = 1; b.click() } return false } const f = document.querySelector('.v-navigation-drawer--active.v-navigation-drawer--right, .v-overlay--active .v-card'); if (!f) return false; f.querySelectorAll('.v-expansion-panel:not(.v-expansion-panel--active) .v-expansion-panel-title').forEach(t => t.click()); return f.innerText.includes('Livros') })()"
  height: 900
- file: guides/site-files/07-layout-options/images/post-options.png
  url: /admin/content/posts/{post:atlas}
  # its form: the options of its type's layout, the select of the format open
  expect: "(() => { const w = window; if (!w.zzEdit) { const b = document.querySelector('.mdi-pencil'); if (b) { w.zzEdit = 1; b.click() } return false } const f = document.querySelector('.v-navigation-drawer--active.v-navigation-drawer--right, .v-overlay--active .v-card'); if (!f) return false; f.querySelectorAll('.v-expansion-panel:not(.v-expansion-panel--active) .v-expansion-panel-title').forEach(t => t.click()); const l = [...f.querySelectorAll('.v-select')].find(e => e.innerText.includes('Formato')); if (!l) return false; l.scrollIntoView({block: 'center'}); if (!w.zzOpen) { w.zzOpen = 1; setTimeout(() => l.querySelector('.v-field').dispatchEvent(new MouseEvent('mousedown', {bubbles: true})), 500) } return [...document.querySelectorAll('.v-overlay--active .v-list-item')].some(i => i.innerText.includes('Capa dura')) })()"
  height: 900
# the editor in a tab of its own ("Open the editor"): its header, the IDE — a
# file open, the layouts' options, their documentation in the Preview —; an
# image
- file: guides/site-files/01-edit/images/ide.png
  url: /admin/site/site-files/editor
  wait: .gadide-host
  before: "(() => { const steps = [['config', 0], ['layout_config.gad', 0]]; let i = 0; const tick = () => { if (i >= steps.length) return; const [n, k] = steps[i]; const r = [...document.querySelectorAll('.pnl-row')].filter(e => e.innerText.trim() === n)[k]; if (r) { r.click(); i++ } setTimeout(tick, 600) }; setTimeout(tick, 1500); return true })()"
  expect: "!!document.querySelector('.gad-ide__doc h4, .gad-ide__doc p') && document.querySelector('.editor-tab--active')?.innerText.includes('layout_config')"
  width: 1440
  height: 900
- file: guides/site-files/01-edit/images/ide-image.png
  url: /admin/site/site-files/editor
  wait: .gadide-host
  before: "(() => { const steps = [['static', 0], ['static', 1], ['img', 0], ['logo.svg', 0]]; let i = 0; const tick = () => { if (i >= steps.length) return; const [n, k] = steps[i]; const r = [...document.querySelectorAll('.pnl-row')].filter(e => e.innerText.trim() === n)[k]; if (r) { r.click(); i++ } setTimeout(tick, 600) }; setTimeout(tick, 1500); return true })()"
  expect: "[...document.querySelectorAll('.gad-ide__image img')].length === 2 && [...document.querySelectorAll('.gad-ide__image img')].every(i => i.naturalWidth > 0)"
  width: 1440
  height: 900
# the step "Work together": the tab Sharing — whom the draft is shared with,
# the past ones —, sharing it, the tab Drafts, and another's draft (the
# sharings of the seed: tools/userdocs-shots seedSharing)
- file: guides/site-files/09-sharing/images/shares.png
  url: /admin/site/site-files
  wait: .v-tabs
  expect: "(() => { const t = [...document.querySelectorAll('.v-tab')][2]; if (t && !window.zzOpen) { window.zzOpen = 1; t.click() } return !!document.querySelector('.v-window-item--active [data-share]') && !!document.querySelector('.v-window-item--active [data-revoke]') })()"
  width: 1440
  height: 900
- file: guides/site-files/09-sharing/images/share.png
  url: /admin/site/site-files
  wait: .v-tabs
  # the dialog of Share: the user, until when
  expect: "(() => { const w = window; if (!w.zzTab) { const t = [...document.querySelectorAll('.v-tab')][2]; if (t) { w.zzTab = 1; t.click() } return false } const b = document.querySelector('.v-window-item--active [data-share-action]'); if (b && !w.zzOpen) { w.zzOpen = 1; b.click() } return !!document.querySelector('.v-overlay--active [data-share-user]') })()"
  width: 1440
  height: 900
- file: guides/site-files/09-sharing/images/drafts.png
  url: /admin/site/site-files
  wait: .v-tabs
  expect: "(() => { const t = [...document.querySelectorAll('.v-tab')][3]; if (t && !window.zzOpen) { window.zzOpen = 1; t.click() } return !!document.querySelector('.v-window-item--active [data-shared-draft]') && document.querySelectorAll('.v-window-item--active [data-draft]').length >= 2 })()"
  width: 1440
  height: 900
- file: guides/site-files/09-sharing/images/shared-draft.png
  url: /admin/site/site-files/u/{user:bia}
  wait: "[data-draft-owner]"
  width: 1440
  height: 900
